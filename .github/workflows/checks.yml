name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and verification dependencies
        run: |
          sudo tee /etc/apt/apt.conf.d/99timeout <<<'Acquire::http::Timeout "30"; Acquire::Retries "3";'
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc poppler-utils texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra \
            texlive-science texlive-plain-generic
          python -m pip install -r requirements-dev.txt
      - run: npm ci
      - name: Check all bundled Python tools and tests
        run: |
          ruff check src/tools/*.py example/scripts/*.py test/*_test.py
          ruff format --check src/tools/*.py example/scripts/*.py test/*_test.py
          python -m py_compile src/tools/*.py example/scripts/*.py test/*_test.py
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js src/*.cjs src/webview/editor.js test/*.test.js; do
            node --check "$file"
          done
      - name: Require Chrome for clipboard regression tests
        run: test -x /usr/bin/google-chrome
      - run: npm test
      - run: npm run package
      - name: Verify tracked bundle is current
        run: git diff --exit-code -- src/webview/bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: aspyrus-extension
          path: aspyrus-*.vsix
