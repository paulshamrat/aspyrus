<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalLeaf — Offline LaTeX Editor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>"
    />
    <link rel="stylesheet" href="/styles.css?v=20260912_2" />
    <link rel="stylesheet" href="/monaco/vs/editor/editor.main.css" />
  </head>
  <body class="theme-dark">
    <!-- Top Navigation Bar (Clean, Minimalist Overleaf Style) -->
    <header class="navbar">
      <div class="nav-left">
        <div class="brand">
          <span class="brand-icon">🍃</span>
          <span class="brand-name">LocalLeaf</span>
        </div>

        <div class="file-badge" id="file-selector-btn" title="Click to switch active file">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
          <span id="active-filename">Loading...</span>
          <span class="chevron">▾</span>
        </div>
      </div>

      <div class="nav-center">
        <!-- Mode Switch: Code vs Visual -->
        <div class="mode-toggle-group">
          <button class="mode-toggle-btn" id="btn-mode-code" title="Code Source Mode">Code</button>
          <button class="mode-toggle-btn active" id="btn-mode-visual" title="Visual Rich-Text Mode">
            Visual
          </button>
        </div>
      </div>

      <div class="nav-right">
        <!-- Single Unified Compile Action (Generates PDF + DOCX) -->
        <button
          class="btn btn-recompile"
          id="btn-recompile"
          title="Compile PDF and DOCX (Ctrl+S or Ctrl+Enter)"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
          >
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>Compile</span>
        </button>

        <div class="status-badge" id="status-badge" title="Document & Compilation Status">
          <span class="status-dot"></span>
          <span id="status-text">Ready</span>
        </div>

        <label class="checkbox-label" title="Auto-compile every time you save with Ctrl+S">
          <input type="checkbox" id="auto-compile-chk" checked />
          <span>Auto-compile</span>
        </label>

        <button class="btn btn-icon" id="btn-toggle-log" title="Toggle LaTeX Output Logs">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="21" y1="10" x2="3" y2="10"></line>
            <line x1="21" y1="6" x2="3" y2="6"></line>
            <line x1="21" y1="14" x2="3" y2="14"></line>
            <line x1="21" y1="18" x2="7" y2="18"></line>
          </svg>
          <span>Logs</span>
        </button>

        <button class="btn btn-icon" id="btn-theme" title="Toggle Light/Dark Theme">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Main Editor Viewport (Full Width, Centered Canvas) -->
    <main class="workspace" id="workspace">
      <!-- Monaco Code Editor View -->
      <div id="editor-container" class="editor-view hidden"></div>

      <!-- Visual Document View (Overleaf Visual Mode) -->
      <div id="visual-container" class="editor-view visual-view">
        <div class="visual-canvas-wrapper" id="visual-canvas-wrapper">
          <div class="visual-body" id="visual-body" contenteditable="true" spellcheck="true">
            <!-- Rendered LaTeX document goes here -->
          </div>
        </div>
      </div>
    </main>

    <!-- Collapsible Bottom Log / Error Drawer -->
    <div class="log-drawer collapsed" id="log-drawer">
      <div class="log-drawer-header">
        <div class="log-tabs">
          <button class="tab-btn active" data-tab="tab-errors">
            Issues <span class="badge" id="error-count-badge">0</span>
          </button>
          <button class="tab-btn" data-tab="tab-raw">Raw Log</button>
        </div>
        <div class="log-header-actions">
          <button
            class="btn-dismiss-logs"
            id="btn-dismiss-logs"
            title="Dismiss Issues / Logs (Esc)"
          >
            ✕ Dismiss
          </button>
          <button class="btn-close" id="btn-close-log" title="Close Logs (Esc)">✕</button>
        </div>
      </div>
      <div class="log-drawer-content">
        <div class="tab-panel active" id="tab-errors">
          <div id="errors-list" class="errors-list">
            <div class="empty-log-msg">No compilation issues detected. Everything looks clean!</div>
          </div>
        </div>
        <div class="tab-panel" id="tab-raw">
          <pre id="raw-log-text">Compilation log is empty.</pre>
        </div>
      </div>
    </div>

    <!-- File Switcher Modal -->
    <div class="modal-overlay hidden" id="file-modal">
      <div class="modal">
        <div class="modal-header">
          <h3>Switch LaTeX File</h3>
          <button class="modal-close" id="btn-close-modal">✕</button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            id="file-search-input"
            placeholder="Search .tex files..."
            class="search-input"
          />
          <div class="file-list" id="file-list">
            <div class="file-list-loading">Scanning directory for .tex files...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden compatibility elements for existing DOM lookups -->
    <div style="display: none" id="compat-hidden-shelf">
      <select id="engine-select">
        <option value="pdflatex" selected>pdflatex</option>
      </select>
      <div id="visual-toolbar"></div>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
