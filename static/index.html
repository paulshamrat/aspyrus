<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalLeaf — Offline LaTeX Editor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/monaco/vs/editor/editor.main.css">
</head>
<body class="theme-dark">
  <!-- Top Navigation Bar (Overleaf style) -->
  <header class="navbar">
    <div class="nav-left">
      <div class="brand">
        <span class="brand-icon">🍃</span>
        <span class="brand-name">LocalLeaf</span>
      </div>
      
      <div class="file-badge" id="file-selector-btn" title="Click to switch active file">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
          <polyline points="13 2 13 9 20 9"></polyline>
        </svg>
        <span id="active-filename">Loading...</span>
        <span class="chevron">▾</span>
      </div>
    </div>

    <div class="nav-center">
      <button class="btn btn-recompile" id="btn-recompile" title="Recompile (Ctrl+S or Ctrl+Enter)">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Recompile</span>
      </button>

      <div class="engine-select-wrapper">
        <label for="engine-select">Engine:</label>
        <select id="engine-select" class="select-input">
          <option value="pdflatex" selected>pdflatex</option>
          <option value="lualatex">lualatex</option>
          <option value="xelatex">xelatex</option>
        </select>
      </div>

      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Ready</span>
      </div>
    </div>

    <div class="nav-right">
      <!-- Toggle Side PDF Preview Button -->
      <button class="btn btn-icon btn-toggle-pdf" id="btn-toggle-pdf" title="Toggle PDF Preview (Alt+P or double-click divider)">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        <span id="btn-toggle-pdf-text">Hide PDF</span>
      </button>

      <label class="checkbox-label" title="Auto-compile every time you save with Ctrl+S">
        <input type="checkbox" id="auto-compile-chk" checked>
        <span>Auto-compile</span>
      </label>

      <button class="btn btn-icon" id="btn-toggle-log" title="Toggle LaTeX Output Logs">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="21" y1="10" x2="3" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="7" y2="18"></line>
        </svg>
        <span>Logs</span>
      </button>

      <button class="btn btn-icon" id="btn-download-pdf" title="Download Compiled PDF">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>

      <button class="btn btn-icon" id="btn-theme" title="Toggle Light/Dark Theme">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Main Split-Screen Workspace -->
  <main class="workspace" id="workspace">
    <!-- Editor Pane -->
    <div class="pane editor-pane" id="editor-pane">
      <!-- Editor Header Bar with Overleaf [Code] [Visual] toggle -->
      <div class="editor-header-bar">
        <!-- Visual Toolbar (Only active when in Visual mode) -->
        <div class="visual-toolbar" id="visual-toolbar">
          <button class="v-btn" id="v-btn-undo" title="Undo (Ctrl+Z)">↶</button>
          <button class="v-btn" id="v-btn-redo" title="Redo (Ctrl+Y)">↷</button>
          <div class="v-sep"></div>
          <button class="v-btn font-bold" id="v-btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button class="v-btn font-italic" id="v-btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <div class="v-sep"></div>
          <button class="v-btn" id="v-btn-h2" title="Section Heading"><b>H2</b></button>
          <button class="v-btn" id="v-btn-bullet" title="Bullet List">• ≡</button>
          <button class="v-btn" id="v-btn-number" title="Numbered List">1. ≡</button>
        </div>

        <!-- Overleaf Mode Switch: Code vs Visual -->
        <div class="mode-toggle-group">
          <button class="mode-toggle-btn" id="btn-mode-code">Code</button>
          <button class="mode-toggle-btn active" id="btn-mode-visual">Visual</button>
        </div>
      </div>

      <!-- Raw Monaco Code Editor View -->
      <div id="editor-container" class="editor-view hidden"></div>

      <!-- Visual Rich-Text Document View (Overleaf Visual Mode) -->
      <div id="visual-container" class="editor-view visual-view">
        <!-- Collapsible Document Preamble Accordion (Just like Overleaf) -->
        <div class="preamble-card" id="preamble-card">
          <div class="preamble-header" id="preamble-toggle">
            <span class="preamble-arrow" id="preamble-arrow">▸</span>
            <span class="preamble-title">Show document preamble</span>
            <span class="preamble-hint">(LaTeX packages, geometry & setup)</span>
          </div>
          <div class="preamble-body collapsed" id="preamble-body">
            <textarea id="preamble-textarea" spellcheck="false" placeholder="LaTeX preamble (packages, macros, definitions)..."></textarea>
          </div>
        </div>

        <!-- Document Content Canvas -->
        <div class="visual-canvas-wrapper">
          <div class="visual-body" id="visual-body" contenteditable="true" spellcheck="true">
            <!-- Clean visual rendered LaTeX document goes here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Resizable Splitter Handle -->
    <div class="splitter" id="splitter" title="Drag to resize, double-click to collapse/expand PDF"></div>

    <!-- PDF Viewer Pane (Rendered via PDF.js Canvas) -->
    <div class="pane pdf-pane" id="pdf-pane">
      <div class="pdf-container" id="pdf-container">
        <!-- PDF.js Canvas Scrollable Viewport -->
        <div id="pdf-pages-container" class="pdf-pages-container">
          <div class="pdf-loading-msg" id="pdf-loading-msg">Rendering PDF preview...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Collapsible Bottom Log / Error Drawer -->
  <div class="log-drawer collapsed" id="log-drawer">
    <div class="log-drawer-header">
      <div class="log-tabs">
        <button class="tab-btn active" data-tab="tab-errors">
          Issues <span class="badge" id="error-count-badge">0</span>
        </button>
        <button class="tab-btn" data-tab="tab-raw">Raw Log</button>
      </div>
      <button class="btn-close" id="btn-close-log" title="Close Logs">✕</button>
    </div>
    <div class="log-drawer-content">
      <div class="tab-panel active" id="tab-errors">
        <div id="errors-list" class="errors-list">
          <div class="empty-log-msg">No compilation issues detected. Everything looks clean!</div>
        </div>
      </div>
      <div class="tab-panel" id="tab-raw">
        <pre id="raw-log-text">Compilation log is empty.</pre>
      </div>
    </div>
  </div>

  <!-- File Switcher Modal -->
  <div class="modal-overlay hidden" id="file-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Switch LaTeX File</h3>
        <button class="modal-close" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="file-search-input" placeholder="Search .tex files..." class="search-input">
        <div class="file-list" id="file-list">
          <div class="file-list-loading">Scanning directory for .tex files...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- PDF.js & Monaco Scripts -->
  <script src="/monaco/vs/loader.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
